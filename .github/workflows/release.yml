name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Verify unit tests before packaging
        run: cargo test --release

      - name: Build optimized VoxelMotion binary
        run: cargo build --release

      - name: Package Windows x64 archive
        shell: pwsh
        run: |
          $stage = "release_stage"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "target\release\VoxelMotion.exe" "$stage\VoxelMotion.exe"
          Copy-Item "README.md" "$stage\README.md"
          Copy-Item "LICENSE" "$stage\LICENSE"
          Copy-Item "CHANGELOG.md" "$stage\CHANGELOG.md"
          Compress-Archive -Path "$stage\*" -DestinationPath "VoxelMotion-Studio-Windows-x64.zip" -Force

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            VoxelMotion-Studio-Windows-x64.zip
            target/release/VoxelMotion.exe
