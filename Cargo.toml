[package]
name = "voxelmotion-studio"
version = "1.0.0"
edition = "2021"
license = "MIT"
description = "VoxelMotion Studio - Native GPU 3D Voxel Keyframe Animation Studio (Rust + Slint + wgpu DX12/Vulkan)"

[[bin]]
name = "VoxelMotion"
path = "src/main.rs"

[dependencies]
slint = { version = "1.18", features = ["backend-winit", "renderer-femtovg-wgpu", "unstable-wgpu-30", "unstable-winit-030", "serde"] }
wgpu = "30"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
rfd = "0.15"
bytemuck = { version = "1", features = ["derive"] }

[build-dependencies]
slint-build = "1.18"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
